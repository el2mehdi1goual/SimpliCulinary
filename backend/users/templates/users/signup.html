{% extends "base/base.html" %}
{% load crispy_forms_tags %}

{% block title %}Inscription | SimpliCulinary{% endblock %}

{% block content %}
<div class="container py-4">
    <h2>Inscription</h2>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}

        <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>
</div>
{% endblock %}
